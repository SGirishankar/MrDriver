<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Desi Mini Truck</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;600;700&family=Rajdhani:wght@600;700&family=Baloo+Thambi+2:wght@600;800&family=Hind+Madurai:wght@400;600;700&display=swap">

<style>
/* Realistic driving-sim HUD: frosted dark glass, thin hairlines, one amber accent. The 3D view stays the hero. */
:root {
  color-scheme: dark;
  --ink: #0b0d0f;
  --glass: rgba(14, 17, 20, 0.58);
  --glass-hi: rgba(22, 26, 30, 0.78);
  --line: rgba(255, 255, 255, 0.09);
  --text: #eef1f3;
  --muted: #98a2ab;
  --dim: #66717a;
  --accent: #f5a524;
  --accent-ink: #1a1204;
  --ok: #4ade80;
  --warn: #fbbf24;
  --bad: #f43f5e;
  --ui: "Inter", "Noto Sans Tamil", "Segoe UI", system-ui, sans-serif;
  --ta: "Noto Sans Tamil", "Inter", system-ui, sans-serif;
  --num: "Rajdhani", "Inter", system-ui, sans-serif;
}
html, body { height: 100%; margin: 0; }
body { background: var(--ink); color: var(--text); font-family: var(--ui); overflow: hidden; overscroll-behavior: none; -webkit-font-smoothing: antialiased; }
#root { height: 100%; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg { display: block; }

.game { position: relative; height: 100vh; height: 100dvh; overflow: hidden; background: #8fb3c9; user-select: none; -webkit-user-select: none; touch-action: none; }
.game canvas.gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 42%, transparent 62%, rgba(0,0,0,.28) 100%); }
.panel { background: linear-gradient(180deg, rgba(30,34,39,.74), rgba(10,12,15,.68)); border: 1px solid rgba(255,255,255,.08); border-top-color: rgba(255,255,255,.16); border-radius: 12px; backdrop-filter: blur(18px) saturate(1.35); -webkit-backdrop-filter: blur(18px) saturate(1.35); box-shadow: 0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.05); }

/* top bar */
.hud { position: absolute; top: max(10px, env(safe-area-inset-top, 0px)); left: 0; right: 0; display: flex; gap: 10px; align-items: flex-start; pointer-events: none;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.job { padding: 9px 14px 10px; min-width: 0; max-width: 380px; flex: 0 1 auto; display: grid; gap: 2px; }
.job .kicker { display: flex; align-items: center; gap: 8px; font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.job .kicker i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
.job .en { font-size: 14px; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.job .ta { font-family: var(--ta); font-size: 12px; color: var(--muted); line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.job .row { display: flex; align-items: baseline; gap: 12px; margin-top: 3px; }
.job .dist { font-family: var(--num); font-weight: 700; font-size: 20px; line-height: 1; font-variant-numeric: tabular-nums; }
.job .dist small { font-size: 12px; color: var(--muted); font-weight: 600; margin-left: 2px; }
.job .cash { font-family: var(--num); font-weight: 700; font-size: 16px; color: var(--ok); margin-left: auto; font-variant-numeric: tabular-nums; }
.grow { flex: 1 1 0; }
.mapwrap { position: relative; flex: none; pointer-events: auto; cursor: pointer; }
.minimap { width: 118px; height: 118px; border-radius: 50%; background: rgba(12,15,18,.62); box-shadow: 0 0 0 1px var(--line), 0 8px 24px rgba(0,0,0,.3); display: block; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.mapwrap .n { position: absolute; top: -2px; left: 50%; transform: translateX(-50%); font-size: 9px; font-weight: 800; color: var(--accent); }
.tools { display: flex; flex-direction: column; gap: 8px; flex: none; }
.iconbtn { pointer-events: auto; width: 42px; height: 42px; display: grid; place-items: center; cursor: pointer; padding: 0; color: var(--text); }
.iconbtn svg { width: 20px; height: 20px; }
.iconbtn .cap { position: absolute; font-size: 8px; }

/* route advisor (GPS), ETS style */
.advisor { width: min(330px, 34vw, 50vh); overflow: hidden; pointer-events: auto; flex: none; }
.adv-head { display: flex; align-items: center; gap: 10px; padding: 7px 10px; font-size: 11px; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--line); }
.adv-head b { color: var(--text); font-family: var(--num); font-size: 15px; font-variant-numeric: tabular-nums; }
.adv-head .sp { flex: 1; }
.advisor canvas { display: block; width: 100%; aspect-ratio: 600 / 360; cursor: pointer; }
.adv-road { padding: 6px 10px 8px; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.adv-road i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; }
.limit { width: 40px; height: 40px; border-radius: 50%; background: #fff; border: 5px solid #d0201a; color: #111; display: grid; place-items: center; font-family: var(--num); font-weight: 700; font-size: 16px; flex: none; }
.speed.over { color: var(--bad); }
/* freight market */
.vpick { margin: 10px 0 14px; display: grid; gap: 8px; }
.vpick .vrow { display: flex; gap: 8px; }
.vpick .vbtn { flex: 1; text-align: left; padding: 9px 12px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.06); color: inherit; cursor: pointer; font: inherit; }
.vpick .vbtn b { display: block; font-size: 15px; } .vpick .vbtn small { color: var(--muted); font-size: 12px; }
.vpick .vbtn.sel { border-color: #f5a524; background: rgba(245,165,36,.16); }
.vpick label { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--muted); }
.vpick select { flex: 1; max-width: 300px; padding: 7px 9px; border-radius: 9px; border: 1px solid var(--line); background: #1b1f24; color: #fff; font: inherit; font-size: 13px; }
.vpick .vq { font-size: 12px; color: #f5c46a; }
.market { position: absolute; right: max(24px, env(safe-area-inset-right, 0px)); top: 50%; transform: translateY(-50%); width: min(470px, 46vw); max-height: calc(100% - 48px); overflow-y: auto; padding: 16px; border-radius: 14px; }
.market h3 { margin: 0 0 4px; font-family: var(--num); font-size: 22px; text-transform: uppercase; letter-spacing: .02em; }
.market .sub { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
.jobrow { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; text-align: left; padding: 10px 12px; margin-bottom: 6px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,.03); cursor: pointer; }
.jobrow.sel { border-color: var(--accent); background: rgba(245,165,36,.1); }
.jobrow .cg { font-weight: 700; font-size: 14px; }
.jobrow .cg small { font-family: var(--ta); font-weight: 500; color: var(--muted); margin-left: 6px; font-size: 12px; }
.jobrow .pay { font-family: var(--num); font-weight: 700; font-size: 18px; color: var(--ok); text-align: right; }
.jobrow .rt { font-size: 12px; color: #c9d0d6; grid-column: 1 / -1; }
.jobrow .meta { grid-column: 1 / -1; display: flex; gap: 12px; font-size: 11px; color: var(--muted); }
@media (max-width: 860px) { .market { display: none; } }
/* everything on the HUD scales with the window so nothing is pushed off screen */
.hud, .controls, .swheel, .cluster, .action, .progress, .toast { zoom: var(--uiz, 1); }
/* instrument cluster */
body.dmt-cab .cluster { left: auto; right: 13vw; transform: none; } .cluster { position: absolute; left: 50%; bottom: max(12px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(360px, 44vw); padding: 10px 14px 10px; pointer-events: none; }
.revs { display: grid; grid-template-columns: repeat(24, 1fr); gap: 2px; height: 6px; margin-bottom: 8px; }
.revs i { border-radius: 1px; background: rgba(255,255,255,.08); }
.revs i.on { background: #e9edf0; }
.revs i.on.mid { background: var(--warn); }
.revs i.on.red { background: var(--bad); }
.cl-row { display: flex; align-items: center; gap: 12px; }
.speed { font-family: var(--num); font-weight: 700; font-size: 44px; line-height: .9; font-variant-numeric: tabular-nums; min-width: 2.2ch; text-align: right; }
.speed-u { display: grid; font-size: 10px; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; line-height: 1.3; }
.speed-u b { color: var(--text); font-family: var(--num); font-size: 13px; letter-spacing: 0; }
.gearbox { margin-left: 2px; width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--line); display: grid; place-items: center; font-family: var(--num); font-weight: 700; font-size: 22px; background: rgba(255,255,255,.04); }
.gearbox.r { color: var(--bad); border-color: rgba(244,63,94,.5); }
.meters { flex: 1; display: grid; gap: 6px; min-width: 0; }
.meter { display: grid; grid-template-columns: 34px 1fr; align-items: center; gap: 6px; font-size: 9px; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
.meter .bar { height: 4px; border-radius: 2px; background: rgba(255,255,255,.1); overflow: hidden; }
.meter .bar i { display: block; height: 100%; border-radius: 2px; background: var(--text); }
.meter .bar i.low { background: var(--bad); }
.meter .bar i.hp { background: var(--ok); }
.sig { position: absolute; right: 12px; top: -34px; display: flex; align-items: center; gap: 7px; padding: 5px 10px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.sig i { width: 9px; height: 9px; border-radius: 50%; }
.sig.g i { background: var(--ok); box-shadow: 0 0 10px var(--ok); } .sig.a i { background: var(--warn); box-shadow: 0 0 10px var(--warn); } .sig.r i { background: var(--bad); box-shadow: 0 0 10px var(--bad); }

/* touch controls */
.swheel { position: absolute; bottom: max(12px, env(safe-area-inset-bottom, 0px)); width: min(178px, 40vh, 34vw); aspect-ratio: 1; touch-action: none; pointer-events: auto; cursor: grab; }
.swheel.right { right: max(12px, env(safe-area-inset-right, 0px)); }
.swheel.left { left: max(12px, env(safe-area-inset-left, 0px)); }
.swheel svg { width: 100%; height: 100%; filter: drop-shadow(0 10px 18px rgba(0,0,0,.5)); }
.whint { position: absolute; left: 50%; top: -8px; transform: translateX(-50%); padding: 3px 9px; font-size: 11px; pointer-events: none; white-space: nowrap; }
.lampbar { position: absolute; left: 186px; bottom: max(12px, env(safe-area-inset-bottom, 0px)); display: flex; gap: 6px; pointer-events: none; z-index: 3; }
.lampbar.onright { left: auto; right: 186px; }
.lb { pointer-events: auto; touch-action: manipulation; width: 46px; height: 46px; border-radius: 12px; padding: 0; cursor: pointer; display: grid; place-items: center; align-content: center; gap: 1px; color: #8b9096; transition: color .08s, box-shadow .08s; }
.lb small { font-size: 8px; font-weight: 700; letter-spacing: .06em; line-height: 1; }
.lb.armed { color: #b9f5c8; }
.lb.lit { color: #3dff6a; box-shadow: 0 0 14px rgba(61,255,106,.55), inset 0 0 0 1px rgba(61,255,106,.6); }
.lb.red { color: #ff4a3a; box-shadow: 0 0 14px rgba(255,74,58,.55), inset 0 0 0 1px rgba(255,74,58,.6); }
.lb.blue { color: #5ab4ff; box-shadow: 0 0 14px rgba(90,180,255,.55), inset 0 0 0 1px rgba(90,180,255,.6); }
.lb.cyan { color: #9fe3ff; box-shadow: inset 0 0 0 1px rgba(159,227,255,.5); }
@media (max-width: 760px) { .lampbar, .lampbar.onright { left: 12px; right: auto; bottom: 170px; gap: 4px; } .lb { width: 40px; height: 40px; } }
.controls { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px)); display: flex; align-items: flex-end; gap: 10px; pointer-events: none; }
.controls.onleft { right: auto; left: max(12px, env(safe-area-inset-left, 0px)); flex-direction: row-reverse; }
.col { display: flex; flex-direction: column; gap: 10px; align-items: center; }
.round { pointer-events: auto; touch-action: none; width: 52px; height: 52px; border-radius: 50%; cursor: pointer; display: grid; place-items: center; padding: 0; font-size: 10px; font-weight: 700; letter-spacing: .06em; }
.round svg { width: 22px; height: 22px; }
.round.on { background: var(--glass-hi); transform: scale(.95); }
.round .g { font-family: var(--num); font-size: 18px; line-height: 1; }
.round .g.r { color: var(--bad); }
.pedal { pointer-events: auto; touch-action: none; border: 0; padding: 0; background: none; cursor: pointer; transition: transform .06s; }
.pedal svg { width: 100%; height: 100%; filter: drop-shadow(0 8px 12px rgba(0,0,0,.45)); }
.pedal.brake { width: 78px; height: 84px; }
.pedal.gas { width: 58px; height: 124px; }
.pedal.on { transform: perspective(300px) rotateX(18deg) translateY(3px); }

.action { position: absolute; left: 50%; bottom: calc(max(12px, env(safe-area-inset-bottom, 0px)) + 112px); transform: translateX(-50%); pointer-events: auto; border: 0; border-radius: 12px; padding: 10px 18px 10px 12px; z-index: 2;
  background: var(--accent); color: var(--accent-ink); display: flex; align-items: center; gap: 12px; box-shadow: 0 10px 30px rgba(245,165,36,.35); cursor: pointer; max-width: min(92vw, 420px); text-align: left; }
.action kbd { font: 700 12px var(--ui); background: rgba(0,0,0,.18); border-radius: 6px; padding: 4px 8px; }
.action .t { font-family: var(--ta); font-weight: 700; font-size: 15px; line-height: 1.2; }
.action small { display: block; font-size: 12px; font-weight: 600; opacity: .8; }
.progress { position: absolute; left: 50%; bottom: calc(max(12px, env(safe-area-inset-bottom, 0px)) + 112px); transform: translateX(-50%); width: min(300px, 70vw); padding: 10px 14px; font-size: 12px; font-weight: 600; letter-spacing: .04em; }
.progress .bar { height: 4px; border-radius: 2px; background: rgba(255,255,255,.12); margin-top: 8px; overflow: hidden; }
.progress .bar i { display: block; height: 100%; background: var(--accent); }

.bubble { position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); background: rgba(250,250,248,.96); color: #15171a; border-radius: 10px; padding: 6px 11px; font-family: var(--ta); font-weight: 600; font-size: 14px; line-height: 1.25; white-space: nowrap; pointer-events: none; box-shadow: 0 6px 18px rgba(0,0,0,.3); }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -6px; margin-left: -6px; border: 6px solid transparent; border-bottom: 0; border-top-color: rgba(250,250,248,.96); }
.bubble small { display: block; font-family: var(--ui); font-weight: 500; font-size: 11px; color: #5b636b; }

.toast { position: absolute; left: 50%; transform: translateX(-50%); padding: 9px 16px 9px 14px; display: flex; align-items: center; gap: 10px; font-family: var(--ta); font-weight: 600; font-size: 14px; pointer-events: none; white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis; animation: tin .25s ease-out; }
.toast i { width: 4px; align-self: stretch; border-radius: 2px; }
@keyframes tin { from { opacity: 0; transform: translate(-50%, -8px); } to { opacity: 1; transform: translate(-50%, 0); } }

.mapover { position: absolute; inset: 0; z-index: 4; background: rgba(6,8,10,.8); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 10px; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); pointer-events: auto; }
.mapover canvas { max-width: 100%; max-height: calc(100% - 34px); aspect-ratio: 1200 / 1000; border-radius: 14px; box-shadow: 0 0 0 1px var(--line); }
.mapclose { font-size: 12px; color: var(--muted); letter-spacing: .06em; }

/* menus */
.overlay { position: absolute; inset: 0; display: flex; align-items: stretch; z-index: 5; overflow-y: auto; background: linear-gradient(90deg, rgba(6,8,10,.88) 0%, rgba(6,8,10,.62) 38%, rgba(6,8,10,.05) 75%); }
.overlay.center { align-items: center; justify-content: center; background: rgba(6,8,10,.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.menu { width: min(480px, 100%); padding: max(28px, env(safe-area-inset-top, 0px)) 28px 28px max(28px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; justify-content: center; gap: 14px; margin: auto 0; }
.overlay.center .menu { margin: auto; padding: 26px; border-radius: 16px; background: var(--glass-hi); border: 1px solid var(--line); width: min(420px, calc(100% - 32px)); }
.brand { display: flex; align-items: center; gap: 10px; font-size: 11px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: var(--accent); }
.brand::before { content: ""; width: 26px; height: 2px; background: var(--accent); }
.menu h1 { font-family: var(--num); font-weight: 700; font-size: clamp(40px, 7vw, 64px); line-height: .92; margin: 0; letter-spacing: .01em; text-transform: uppercase; }
.menu h2 { font-family: var(--num); font-weight: 700; font-size: 34px; line-height: 1; margin: 0; text-transform: uppercase; }
.menu .tl { font-family: var(--ta); font-size: 16px; color: var(--muted); margin: -4px 0 4px; }
.feat { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
.feat li { display: grid; grid-template-columns: 18px 1fr; gap: 10px; font-size: 13px; line-height: 1.45; color: #cfd5da; }
.feat li svg { width: 16px; height: 16px; margin-top: 2px; color: var(--accent); }
.feat b { color: var(--text); font-weight: 600; }
.keys { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 11px; color: var(--muted); }
.keys kbd { font: 600 11px var(--ui); color: var(--text); background: rgba(255,255,255,.08); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; margin-right: 4px; }
.go { width: 100%; border: 0; border-radius: 10px; padding: 14px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
.go.alt { background: rgba(255,255,255,.06); color: var(--text); border: 1px solid var(--line); text-transform: none; letter-spacing: 0; font-weight: 600; justify-content: space-between; padding: 13px 16px; }
.go.alt span { color: var(--muted); font-weight: 500; }
.go:disabled { opacity: .7; cursor: progress; }
.loadbar { height: 3px; border-radius: 2px; background: rgba(255,255,255,.1); overflow: hidden; }
.loadbar i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.note { font-size: 12px; color: var(--muted); margin: 0; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stats > div { border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: rgba(255,255,255,.03); }
.stats .lbl { font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.stats .val { font-family: var(--num); font-weight: 700; font-size: 24px; font-variant-numeric: tabular-nums; }
.reason { font-family: var(--ta); color: #fda4af; font-weight: 600; margin: 0; font-size: 15px; }
.err { color: #fda4af; font-size: 14px; }
@media (max-width: 720px) {
  .advisor { width: 46vw; } .adv-road { display: none; }
  .minimap { width: 88px; height: 88px; }
  .job { max-width: 46vw; }
  .cluster { width: min(250px, 40vw); padding: 8px 10px; }
  .speed { font-size: 34px; }
  .meters { display: none; }
  .pedal.gas { height: 104px; width: 50px; } .pedal.brake { width: 66px; height: 72px; }
  .round { width: 44px; height: 44px; }
  .action, .progress { bottom: calc(max(12px, env(safe-area-inset-bottom, 0px)) + 90px); }
}
@media (max-height: 420px) { .feat { display: none; } }
.ignition{position:absolute;left:50%;bottom:calc(150px * var(--uiz,1));transform:translateX(-50%) scale(var(--uiz,1));transform-origin:50% 100%;display:flex;align-items:center;gap:12px;padding:12px 22px 12px 14px;border-radius:16px;border:2px solid #f2b705;color:#fff;cursor:pointer;font:inherit;animation:ignPulse 1.4s ease-in-out infinite;z-index:6}
.ignition .key{font-size:30px;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;background:rgba(242,183,5,.18)}
.ignition .t{display:block;font-size:20px;font-weight:700}.ignition small{display:block;opacity:.8;font-size:13px}
.ignition:disabled{animation:none;opacity:.85}
@keyframes ignPulse{0%,100%{box-shadow:0 0 0 0 rgba(242,183,5,.55)}50%{box-shadow:0 0 0 12px rgba(242,183,5,0)}}
</style>

<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/RoundedBoxGeometry.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>
